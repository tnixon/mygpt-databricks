bundle:
  name: st-jude-mygpt

resources:
  apps:
    app:
      name: "st-jude-mygpt"
      description: "St. Jude MyGPT — governed research assistant (POC)"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true

      # Run serving calls on behalf of the signed-in user (OBO).
      user_api_scopes:
        - serving.serving-endpoints

      # FMAPI foundation-model endpoints (direct chat) + the MyGPT agent endpoint.
      resources:
        - name: serving-endpoint
          serving_endpoint:
            name: databricks-claude-sonnet-5
            permission: CAN_QUERY
        - name: serving-endpoint-llama
          serving_endpoint:
            name: databricks-llama-4-maverick
            permission: CAN_QUERY
        - name: serving-endpoint-gptoss
          serving_endpoint:
            name: databricks-gpt-oss-120b
            permission: CAN_QUERY
        - name: agent-endpoint
          serving_endpoint:
            name: mygpt-rag-agent
            permission: CAN_QUERY

targets:
  default:
    default: true
    workspace:
      host: https://adb-7405616422000820.0.azuredatabricks.net
