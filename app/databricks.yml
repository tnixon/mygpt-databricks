bundle:
  name: st-jude-mygpt

# Phase 4 values come from the platform bundle (repo-root databricks.yml):
#   upload_job_id  ← `databricks bundle summary -p mygpt` (jobs.mygpt_upload_ingest), run at repo root
#   experiment_id  ← `databricks experiments get-by-name /Shared/mygpt/mygpt-rag-agent -p mygpt`
#   warehouse_id   ← the serverless SQL warehouse used by the ETL
# The app was first created outside this bundle; bind it once before the first deploy:
#   databricks bundle deployment bind app st-jude-mygpt -p mygpt
variables:
  warehouse_id:
    description: SQL warehouse for the section catalogue (CAN_USE).
    default: ""
  upload_job_id:
    description: Job id of mygpt_upload_ingest (platform bundle).
    default: ""
  experiment_id:
    description: Experiment id of /Shared/mygpt/mygpt-rag-agent (feedback assessments).
    default: ""
  pg_branch:
    description: Lakebase branch holding the app state.
    default: projects/mygpt/branches/production

resources:
  apps:
    app:
      name: "st-jude-mygpt"
      description: "St. Jude MyGPT — governed research assistant (POC)"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true

      # Run serving calls on behalf of the signed-in user (OBO). Reading their groups (SCIM /Me)
      # for group-shared libraries uses iam.current-user:read, a DEFAULT scope every app gets
      # (listing it here is rejected as invalid).
      user_api_scopes:
        - serving.serving-endpoints

      # FMAPI foundation-model endpoints (direct chat) + the MyGPT agent endpoint, and the
      # Phase 4 state: Lakebase, the embeddings gateway, the uploads volume, the ingest job,
      # the section-catalogue warehouse/table, and the shared experiment.
      resources:
        - name: serving-endpoint
          serving_endpoint:
            name: databricks-claude-sonnet-5
            permission: CAN_QUERY
        - name: serving-endpoint-llama
          serving_endpoint:
            name: databricks-llama-4-maverick
            permission: CAN_QUERY
        - name: serving-endpoint-gptoss
          serving_endpoint:
            name: databricks-gpt-oss-120b
            permission: CAN_QUERY
        - name: agent-endpoint
          serving_endpoint:
            name: mygpt-rag-agent
            permission: CAN_QUERY
        - name: embeddings-endpoint
          serving_endpoint:
            name: mygpt-embeddings
            permission: CAN_QUERY
        - name: postgres
          postgres:
            branch: ${var.pg_branch}
            database: ${var.pg_branch}/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
        - name: uploads-volume
          uc_securable:
            securable_full_name: structural_biology.mygpt.uploads
            securable_type: VOLUME
            permission: WRITE_VOLUME
        - name: paper-sections
          uc_securable:
            securable_full_name: structural_biology.mygpt.paper_sections
            securable_type: TABLE
            permission: SELECT
        - name: upload-job
          job:
            id: ${var.upload_job_id}
            permission: CAN_MANAGE_RUN
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: experiment
          experiment:
            experiment_id: ${var.experiment_id}
            permission: CAN_EDIT

targets:
  default:
    default: true
    workspace:
      host: https://adb-7405616422000820.0.azuredatabricks.net
