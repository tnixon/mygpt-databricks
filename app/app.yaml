command: ['npm', 'run', 'start']
env:
  # FMAPI endpoints for DIRECT (non-grounded) chat streaming.
  - name: DATABRICKS_SERVING_ENDPOINT_NAME
    valueFrom: serving-endpoint
  - name: DATABRICKS_SERVING_ENDPOINT_LLAMA
    valueFrom: serving-endpoint-llama
  - name: DATABRICKS_SERVING_ENDPOINT_GPTOSS
    valueFrom: serving-endpoint-gptoss
  # The MyGPT Supervisor endpoint (grounded path): documents / Genie / tools routing.
  - name: MYGPT_AGENT_ENDPOINT
    valueFrom: agent-endpoint
  # SQL warehouse for the governed section catalogue (/api/sections on corpus libraries).
  - name: MYGPT_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # Phase 4: Lakebase app state (libraries, upload index, history, feedback). PGHOST /
  # PGDATABASE / PGUSER / PGSSLMODE are injected by the `postgres` resource.
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres
  - name: MYGPT_PG_SCHEMA
    value: 'mygpt'
  # Unity AI Gateway embeddings endpoint (bge-m3) — embeds queries for upload-library search.
  - name: MYGPT_EMBED_ENDPOINT
    valueFrom: embeddings-endpoint
  # Upload libraries: files land in this volume; the ingest job indexes them into Lakebase.
  # The governed catalog.schema (MYGPT_SCHEMA, e.g. for paper_sections) is derived from it.
  - name: MYGPT_UPLOAD_VOLUME
    valueFrom: uploads-volume
  - name: MYGPT_UPLOAD_JOB_ID
    valueFrom: upload-job
  # Shared MLflow experiment: user feedback becomes `user_rating` assessments on agent traces.
  - name: MYGPT_EXPERIMENT_ID
    valueFrom: experiment
