# Phase-2 quality gates for `run_eval.py --gate true` (minimum per-run aggregate metric).
# Metric names are MLflow's `<assessment>/mean` aggregates (bool / yes-no -> 1/0).
#
# Hard gates (pipeline health + output contract) apply everywhere. Judge thresholds are
# set just below the Phase-2 baseline (agent v10, Sonnet, 2026-10-09; see PLAN.md) so
# later phases can't silently regress; `null` = tracked but not enforced.
#
#   baseline (FR / ES):  retrieval_groundedness 0.638 / 0.633   relevance_to_query 0.990 / 1.000
#                        expectations_guidelines 0.757 / 0.757  mygpt_grounding 0.800 / 0.705
#                        yes_no_format 0.986 / 0.990            safety 1.000 / 1.000
#                        hi_eq_vs_groundedness_auroc 0.654 / 0.605

shared:
  retrieval_ok/mean: 1.0          # every row retrieved >= 1 source, no retrieve_error
  focus_adherence/mean: 1.0       # all sources come from the focused document

sj_global:
  yes_no_format/mean: 0.95        # answers open with Yes / No
  retrieval_groundedness/mean: 0.58
  relevance_to_query/mean: 0.95
  expectations_guidelines/mean: 0.70
  mygpt_grounding/mean: 0.65
  safety/mean: 0.98
  # Informational only: SJ Global asks "does the document mention X?", so when X is
  # absent every chunk is (correctly) judged irrelevant -> ~0.15 by design.
  retrieval_relevance/mean: null
  # Gold (St. Jude SME labels; eval_datasets.policy_gold). Gold baseline: agent v11, Sonnet,
  # 2026-10-13 (FR 98c0fd4d…, ES cb54504a…); gates sit just below the lower of FR / ES.
  #   yes_no_correct 0.771 / 0.695 (sme 0.806 / 0.744, inherited 0.660 / 0.540)
  #   gold_correctness 0.759 / 0.672
  # MyGPT's own SME accuracy (the parity bar) is 0.841, logged by mygpt_eval_reference.
  yes_no_correct/mean: 0.65
  yes_no_correct/sme/mean: 0.70       # base questions (SME-labelled)
  # Q6-10 variants (inherit the base question's gold): informational, 50 rows per language
  # is too noisy to gate (±0.07).
  yes_no_correct/inherited/mean: null
  gold_correctness/mean: 0.62

bluesky:
  # Baseline: agent v11, Sonnet, 282 rows, 2026-10-13 (run 10e3b9e0…). Gates sit just below it.
  #   js_array_valid 0.986  figure_ref_format 0.979  retrieval_groundedness 0.883
  #   no_match_consistent 0.897  kinase_in_context 0.848  relevance_to_query 0.858
  #   mygpt_grounding 0.830  safety 1.000  hi_eq_vs_groundedness_auroc 0.730
  js_array_valid/mean: 0.95       # structured-output validity
  figure_ref_format/mean: 0.93
  retrieval_groundedness/mean: 0.83
  no_match_consistent/mean: 0.85
  kinase_in_context/mean: 0.80    # retrieval sanity: the focused paper's chunks mention the kinase
  relevance_to_query/mean: 0.80
  mygpt_grounding/mean: 0.78
  safety/mean: 0.98
  # Re-baselined on the gold run (0.972) after the "no match" guideline fix.
  expectations_guidelines/mean: 0.92
  vocab_compliance/mean: null     # enforce once expression_systems_list.csv lands
  retrieval_relevance/mean: null  # informational (0.315), as for SJ Global
  # Gold (St. Jude ground truths; eval_datasets.kinase_gold_rows). Gold baseline: agent v11,
  # Sonnet, 2026-10-13 (run 67793350…), ~66 gold rows per question. The `sme_realigned`
  # slice is gold repaired from the file's shifted block.
  #   expression_system_correct 0.424  figure_ref_match 0.985  gold_correctness 0.603
  expression_system_correct/mean: 0.35   # Q11
  figure_ref_match/mean: 0.93            # Q17 (any overlap, as the SMEs graded)
  gold_correctness/mean: 0.52            # Q16v2 (assay category; LLM judge, 75-84% SME agreement)

bioasq:
  # Public benchmark (163 questions: 76 yes/no + 87 factoid) over the whole biomed corpus.
  # Baseline: agent v11, Sonnet, 2026-10-14 (run 4675fbdb…); gates sit just below it.
  #   yes_no_correct 0.908  factoid_match 0.678  gold_correctness 0.519
  #   retrieval_groundedness 0.939  relevance_to_query 0.963  mygpt_grounding 0.736
  # MyGPT's gpt-oss-20b answers (mygpt_eval_reference): yes/no 0.934, factoid 0.609,
  # gold_correctness 0.456.
  retrieval_ok/mean: 1.0
  focus_adherence/mean: null  # overrides `shared`: BioASQ retrieves library-wide (no focus)
  yes_no_correct/mean: 0.85
  factoid_match/mean: 0.62
  gold_correctness/mean: 0.45
  retrieval_groundedness/mean: 0.89
  safety/mean: 0.98
