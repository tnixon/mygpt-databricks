# MyGPT platform bundle (DABs) — Phase 1 / 1b infrastructure as code.
#
# Deploys the ETL pipeline, the custom bge-m3 embedding endpoint, the Unity AI
# Gateway endpoint that fronts it (Phase 1b), and the MyGPT retrieval+scoring
# ResponsesAgent endpoint. The chat APP has its own bundle in app/databricks.yml
# (bundle: st-jude-mygpt); this one owns the data/agent lane so its job tasks can
# reference files under etl/ and agents/ (which live outside the app bundle root).
# Everything here is deployed with `databricks bundle deploy` (profile mygpt) — no
# hand-run CLI/notebook deploys.
#
#   databricks bundle validate -p mygpt
#   databricks bundle deploy   -p mygpt
#   databricks bundle run mygpt_etl -p mygpt            # build tables + config
#   databricks bundle run mygpt_deploy_embedding -p mygpt
#   databricks bundle run mygpt_deploy_gateway -p mygpt   # AI Gateway (needs secret, below)
#   databricks bundle run mygpt_deploy_agent -p mygpt
#   databricks bundle run mygpt_eval_build_datasets -p mygpt   # Phase 2: UC eval datasets
#   databricks bundle run mygpt_eval -p mygpt                  # Phase 2: eval runs (+ gates)
#   databricks bundle run mygpt_eval_monitor -p mygpt          # Phase 2: production monitoring
#   (Phase 4) the app triggers mygpt_upload_ingest itself; see app/README.md for the order.
#
# NOTE 1: Vector Search index CREATION remains a one-time API step (see the tail of
# etl/sql/02_parse_chunk_index.sql); SYNCING it is the last task of mygpt_etl.
# NOTE 2: mygpt_deploy_gateway needs a secret token with CAN QUERY on mygpt-bge-m3:
#   databricks secrets create-scope mygpt --profile mygpt   # if absent
#   databricks secrets put-secret mygpt gw_upstream_token --profile mygpt

bundle:
  name: st-jude-mygpt-platform

# The eval jobs read St. Jude's MyGPT-evaluations CSVs from the synced submodule; the
# eval-corpus PDFs go to the docs volume instead (`make eval-corpus`), so skip them here.
# `include` is needed because .gitignore ignores reference/ (sync follows .gitignore).
sync:
  include:
    - "reference/MyGPT-evaluations/**/*.csv"
  exclude:
    - "reference/**/*.pdf"

variables:
  warehouse_id:
    description: SQL warehouse that runs the ETL SQL (serverless recommended).
    default: ""
  catalog:
    default: structural_biology
  schema:
    default: mygpt
  vs_index:
    description: Corpus-aware Delta Sync index over doc_chunks (synced by mygpt_etl, queried by the agent).
    default: doc_chunks_corpus_index
  pg_project:
    description: Lakebase project holding the app state (Phase 4). Its default branch is `production`.
    default: mygpt

resources:
  # ---------------------------------------------------------------- Phase 4: Lakebase
  # App state (libraries, per-user upload index, history, feedback). Creating the project also
  # creates the `production` branch, its `primary` read-write endpoint and the default
  # `databricks_postgres` database; the app's service principal creates and owns the `mygpt`
  # schema on first start (app/server/db/migrations.ts).
  postgres_projects:
    mygpt:
      project_id: ${var.pg_project}
      display_name: MyGPT app state
      pg_version: 17
      default_endpoint_settings:
        autoscaling_limit_min_cu: 0.5
        autoscaling_limit_max_cu: 4

  volumes:
    # Upload-library files, one folder per library (written by the app, read by mygpt_upload_ingest).
    uploads:
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      name: uploads
      comment: "MyGPT upload libraries: uploads/<library_id>/<doc_id>__<file>"

  experiments:
    # Phase 2: ONE shared experiment for the agent lifecycle — LoggedModels (driver.py),
    # offline eval runs (eval/run_eval.py), and the endpoint's production traces +
    # monitoring scorers (eval/monitor.py). The /Shared/mygpt folder must exist:
    #   databricks workspace mkdirs /Shared/mygpt -p mygpt
    mygpt_rag_agent:
      name: /Shared/mygpt/mygpt-rag-agent

  jobs:
    mygpt_etl:
      name: "[mygpt] ETL — parse, section-chunk, index config"
      tasks:
        - task_key: landing
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/sql/01_landing_documents.sql
        - task_key: parse_chunk_index
          depends_on: [{ task_key: landing }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/sql/02_parse_chunk_index.sql
        - task_key: sections_and_config
          depends_on: [{ task_key: parse_chunk_index }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/sql/03_sections_and_config.sql
        # 02 MERGEs chunk changes into doc_chunks; sync the TRIGGERED index so they become
        # searchable, and wait until it has caught up (fails on a row-count mismatch).
        - task_key: sync_index
          depends_on: [{ task_key: parse_chunk_index }]
          environment_key: default
          spark_python_task:
            python_file: etl/sync_index.py
            parameters:
              ["--index", "${var.catalog}.${var.schema}.${var.vs_index}",
               "--source-table", "${var.catalog}.${var.schema}.doc_chunks"]
      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - databricks-sdk>=0.40

    # Phase 4: index one upload library into Lakebase. Triggered by the app (job_parameters
    # library_id) after an upload; one active run per library is enforced by the app.
    mygpt_upload_ingest:
      name: "[mygpt] Upload ingest — parse, chunk, embed into Lakebase"
      max_concurrent_runs: 4
      parameters:
        - name: library_id
          default: ""
      tasks:
        - task_key: upload_ingest
          environment_key: default
          spark_python_task:
            python_file: etl/upload_ingest.py
            parameters:
              ["--library-id", "{{job.parameters.library_id}}",
               "--pg-endpoint", "projects/${var.pg_project}/branches/production/endpoints/primary",
               "--pg-schema", "mygpt", "--embed-endpoint", "mygpt-embeddings"]
      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - databricks-sdk>=0.70
              - psycopg[binary]>=3.2

    mygpt_deploy_embedding:
      name: "[mygpt] Deploy bge-m3 embedding endpoint"
      tasks:
        - task_key: deploy_embedding
          environment_key: default
          spark_python_task:
            python_file: agents/embedding/driver.py
            parameters:
              ["--catalog", "${var.catalog}", "--schema", "${var.schema}", "--base-dir", "${workspace.file_path}"]
      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - mlflow>=3.1.0
              - databricks-sdk>=0.40
              - sentence-transformers>=3.0.0
              - torch>=2.3

    mygpt_deploy_gateway:
      name: "[mygpt] Deploy Unity AI Gateway embeddings endpoint"
      tasks:
        - task_key: deploy_gateway
          environment_key: default
          spark_python_task:
            python_file: agents/gateway/driver.py
            parameters:
              ["--catalog", "${var.catalog}", "--schema", "${var.schema}", "--base-dir", "${workspace.file_path}"]
      environments:
        - environment_key: default
          spec:
            client: "1"
            # The gateway endpoint is pure routing (external-model proxy) — the deploy
            # job only needs the SDK; no torch/sentence-transformers serving libs.
            dependencies:
              - mlflow>=3.1.0
              - databricks-sdk>=0.40

    mygpt_deploy_agent:
      name: "[mygpt] Deploy MyGPT RAG ResponsesAgent endpoint"
      tasks:
        - task_key: deploy_agent
          environment_key: default
          spark_python_task:
            python_file: agents/rag_agent/driver.py
            parameters:
              ["--catalog", "${var.catalog}", "--schema", "${var.schema}", "--base-dir", "${workspace.file_path}",
               "--experiment", "${resources.experiments.mygpt_rag_agent.name}", "--vs-index-name", "${var.vs_index}"]
      environments:
        - environment_key: default
          spec:
            client: "1"
            # MLflow runs a full validation predict at log time (retrieve -> rerank ->
            # generate -> score), so the job env needs the serving libs too.
            dependencies:
              - mlflow>=3.1.0
              - databricks-agents
              - databricks-sdk>=0.40
              - sentence-transformers>=3.0.0
              - torch>=2.3
              - scikit-learn>=1.5

    # ---------------------------------------------------------------- Phase 2: eval
    mygpt_eval_build_datasets:
      name: "[mygpt] Eval — build UC eval datasets (MyGPT-evaluations)"
      tasks:
        - task_key: build_datasets
          environment_key: eval
          spark_python_task:
            python_file: eval/build_datasets.py
            parameters:
              ["--catalog", "${var.catalog}", "--schema", "${var.schema}", "--base-dir", "${workspace.file_path}",
               "--experiment", "${resources.experiments.mygpt_rag_agent.name}",
               "--datasets", "{{job.parameters.datasets}}"]
      parameters:
        - name: datasets
          default: "health_policies_fr,health_policies_es,kinase_literature"
      environments:
        - environment_key: eval
          spec:
            client: "1"
            dependencies: ["mlflow[databricks]>=3.4", "databricks-agents", "databricks-sdk>=0.40", "pyyaml"]

    mygpt_eval:
      name: "[mygpt] Eval — mlflow.genai.evaluate over dataset x model (+ gates)"
      parameters:
        # One run per {dataset, model}. kinase_literature joins once St. Jude's PDFs are
        # indexed; add llama / gptoss entries for the model comparison baseline.
        - name: matrix
          default: '[{"dataset": "health_policies_fr", "model": "sonnet"}, {"dataset": "health_policies_es", "model": "sonnet"}]'
        - name: max_rows
          default: "0"
        - name: gate
          default: "false"
      tasks:
        - task_key: eval
          for_each_task:
            inputs: "{{job.parameters.matrix}}"
            # one dataset at a time: the agent endpoint (CPU Small) is the bottleneck
            concurrency: 1
            task:
              task_key: eval_one
              environment_key: eval
              spark_python_task:
                python_file: eval/run_eval.py
                parameters:
                  ["--dataset", "{{input.dataset}}", "--model", "{{input.model}}",
                   "--catalog", "${var.catalog}", "--schema", "${var.schema}", "--base-dir", "${workspace.file_path}",
                   "--experiment", "${resources.experiments.mygpt_rag_agent.name}",
                   "--max-rows", "{{job.parameters.max_rows}}", "--gate", "{{job.parameters.gate}}"]
      environments:
        - environment_key: eval
          spec:
            client: "1"
            dependencies: ["mlflow[databricks]>=3.4", "databricks-agents", "databricks-sdk>=0.40", "pyyaml"]

    mygpt_eval_monitor:
      name: "[mygpt] Eval — register production-monitoring scorers"
      tasks:
        - task_key: monitor
          environment_key: eval
          spark_python_task:
            python_file: eval/monitor.py
            parameters:
              ["--base-dir", "${workspace.file_path}", "--experiment", "${resources.experiments.mygpt_rag_agent.name}"]
      environments:
        - environment_key: eval
          spec:
            client: "1"
            dependencies: ["mlflow[databricks]>=3.4", "databricks-agents", "databricks-sdk>=0.40", "pyyaml"]

targets:
  default:
    default: true
    workspace:
      host: https://adb-7405616422000820.0.azuredatabricks.net
