# MyGPT platform bundle (DABs) — Phase 1 / 1b infrastructure as code.
#
# Deploys the ETL pipeline, the custom bge-m3 embedding endpoint, the Unity AI
# Gateway endpoint that fronts it (Phase 1b), and the MyGPT retrieval+scoring
# ResponsesAgent endpoint. The chat APP has its own bundle in app/databricks.yml
# (bundle: st-jude-mygpt); this one owns the data/agent lane so its job tasks can
# reference files under etl/ and agents/ (which live outside the app bundle root).
# Everything here is deployed with `databricks bundle deploy` (profile mygpt) — no
# hand-run CLI/notebook deploys.
#
#   databricks bundle validate -p mygpt
#   databricks bundle deploy   -p mygpt
#   databricks bundle run mygpt_etl -p mygpt            # build tables + config
#   databricks bundle run mygpt_deploy_embedding -p mygpt
#   databricks bundle run mygpt_deploy_gateway -p mygpt   # AI Gateway (needs secret, below)
#   databricks bundle run mygpt_deploy_agent -p mygpt
#   (Phase 5) databricks bundle run mygpt_deploy_chat_gateway -p mygpt   # mygpt-chat (AI Gateway)
#   (Phase 5) databricks bundle run mygpt_deploy_tools -p mygpt          # UC-function tools (managed MCP)
#   (Phase 5) databricks bundle run mygpt_deploy_genie -p mygpt          # Genie space over the seed tables
#   (Phase 5) databricks bundle run mygpt_deploy_supervisor -p mygpt     # mygpt-supervisor (the app's backend)
#   databricks bundle run mygpt_eval_build_datasets -p mygpt   # Phase 2: UC eval datasets
#   databricks bundle run mygpt_eval -p mygpt                  # Phase 2: eval runs (+ gates)
#   databricks bundle run mygpt_eval_monitor -p mygpt          # Phase 2: production monitoring
#   (Phase 4) the app triggers mygpt_upload_ingest itself; see app/README.md for the order.
#
# NOTE 1: the last task of mygpt_etl syncs the Vector Search index, creating it on the first
# run (etl/sync_index.py); the VS endpoint itself is a bundle resource.
# NOTE 2: mygpt_deploy_gateway needs a secret token with CAN QUERY on mygpt-bge-m3, in the
# bundle-managed scope (scope / key = var.secret_scope / var.gw_token_secret_key):
#   databricks secrets put-secret mygpt gw_upstream_token --profile mygpt
# NOTE 3 (optional): the agents mirror their traces to LangSmith once its API key is in the
# scope (`make secrets LANGSMITH=1` reads it from .env); redeploy both agents after adding it:
#   databricks secrets put-secret mygpt langsmith_api_key --profile mygpt

bundle:
  name: st-jude-mygpt-platform

# The eval jobs read St. Jude's MyGPT-evaluations CSVs from the synced submodule; the
# eval-corpus PDFs go to the docs volume instead (`make eval-corpus`), so skip them here.
# `include` is needed because .gitignore ignores reference/ (sync follows .gitignore).
sync:
  include:
    - "reference/MyGPT-evaluations/**/*.csv"
  exclude:
    - "reference/**/*.pdf"
    # St. Jude's private ground truths go to the restricted eval_private volume instead.
    - "reference/MyGPT-evaluations-private-main/**"

# Every resource name below is a variable. The current deployment's values live in
# .databricks/bundle/default/variable-overrides.json (gitignored; `make config` installs it from
# variable-overrides.example.json). Precedence: --var > BUNDLE_VAR_<name> > overrides file > default.
# Keys shared with the app bundle (app/databricks.yml) must match there too — see DEPLOYMENT.md.
variables:
  # ------------------------------------------------------------- infrastructure
  warehouse_id:
    description: SQL warehouse that runs the ETL SQL (serverless recommended).
    default: ""
  catalog:
    description: UC catalog holding the MyGPT schemas.
    default: structural_biology
  schema:
    description: UC schema for the corpus tables, indexes, volumes, models and eval datasets.
    default: mygpt
  tools_schema:
    description: UC schema (in `catalog`) whose functions are the Supervisor's managed-MCP tools.
    default: mygpt_tools
  docs_volume:
    description: UC volume (in catalog.schema) holding the governed corpus PDFs, one folder per corpus.
    default: docs
  uploads_volume:
    description: UC volume (in catalog.schema) holding the app's upload libraries.
    default: uploads
  eval_private_volume:
    description: Restricted UC volume (in catalog.schema) holding St. Jude's private ground truths.
    default: eval_private
  reference_volume:
    description: UC volume (in catalog.schema) holding the MyGPT-evaluations CSVs (Genie seed + eval inputs).
    default: reference
  vs_endpoint:
    description: Vector Search endpoint serving the corpus index.
    default: mygpt-vs
  vs_index:
    description: Corpus-aware Delta Sync index over doc_chunks (synced by mygpt_etl, queried by the agent).
    default: doc_chunks_corpus_index
  pg_project:
    description: Lakebase project holding the app state (Phase 4). Its default branch is `production`.
    default: mygpt
  pg_display_name:
    description: Display name of the Lakebase project.
    default: MyGPT app state
  pg_schema:
    description: Postgres schema (in databricks_postgres) holding the app state.
    default: mygpt
  experiment_path:
    description: Shared MLflow experiment (LoggedModels, eval runs, production traces). Its folder must exist.
    default: /Shared/mygpt/mygpt-rag-agent
  # ------------------------------------------------------------- display names
  name_prefix:
    description: Prefix of every job and dashboard display name.
    default: "[mygpt]"
  dashboard_display_name:
    description: Benchmarks dashboard title (after name_prefix).
    default: "Benchmarks — MyGPT vs Databricks agent"
  genie_title:
    description: Title of the Genie space over the structured seed tables (the Supervisor finds it by title).
    default: MyGPT structured data
  # ------------------------------------------------------------- model serving
  embedding_model:
    description: UC model name (in catalog.schema) of the bge-m3 embedding model.
    default: bge_m3
  embedding_endpoint:
    description: Custom bge-m3 Model Serving endpoint (also the Vector Search managed-embedding model).
    default: mygpt-bge-m3
  embeddings_gateway:
    description: Unity AI Gateway embeddings endpoint fronting embedding_endpoint.
    default: mygpt-embeddings
  chat_gateway:
    description: Unity AI Gateway chat endpoint (the agents' default answer model).
    default: mygpt-chat
  chat_upstream:
    description: Foundation-model endpoint behind chat_gateway.
    default: databricks-claude-sonnet-5
  translate_gateway:
    description: Unity AI Gateway translation endpoint for non-English corpora.
    default: mygpt-translate
  translate_upstream:
    description: Foundation-model endpoint behind translate_gateway.
    default: databricks-gemma-3-12b
  fm_sonnet:
    description: Direct FMAPI sonnet endpoint (RAG agent resource; the eval model matrix).
    default: databricks-claude-sonnet-5
  fm_llama:
    description: Direct FMAPI llama endpoint (eval model matrix).
    default: databricks-llama-4-maverick
  fm_gptoss:
    description: Direct FMAPI gpt-oss endpoint (eval model matrix).
    default: databricks-gpt-oss-120b
  rag_agent_model:
    description: UC model name (in catalog.schema) of the RAG ResponsesAgent.
    default: mygpt_rag_agent
  rag_agent_endpoint:
    description: Serving endpoint of the RAG ResponsesAgent (the eval target; called by the Supervisor).
    default: mygpt-rag-agent
  supervisor_model:
    description: UC model name (in catalog.schema) of the Supervisor.
    default: mygpt_supervisor
  supervisor_endpoint:
    description: Serving endpoint of the Supervisor (the app's backend).
    default: mygpt-supervisor
  # ------------------------------------------------------------- secret NAMES (never values)
  secret_scope:
    description: Secret scope holding the gateway credentials.
    default: mygpt
  gw_token_secret_key:
    description: Secret key (in secret_scope) of the token with CAN QUERY on the gateways' upstream endpoints.
    default: gw_upstream_token
  azure_key_secret_key:
    description: Secret key (in secret_scope) of the Azure AI Foundry API key (chat fallback route).
    default: azure_foundry_key
  langsmith_api_key_secret_key:
    description: Secret key (in secret_scope) of the LangSmith API key. The agents trace to LangSmith only when it exists.
    default: langsmith_api_key
  # ------------------------------------------------------------- LangSmith (optional trace mirror)
  langsmith_project:
    description: LangSmith project receiving the agents' traces.
    default: mygpt
  langsmith_endpoint:
    description: LangSmith API URL (EU / self-hosted installs differ).
    default: https://api.smith.langchain.com
  langsmith_workspace_id:
    description: LangSmith workspace id; needed when the API key is org-scoped.
    default: ""
  langsmith_hide_content:
    description: '"true" sends only the run tree, timings and metadata to LangSmith (no questions, chunks or answers).'
    default: "false"

resources:
  # ---------------------------------------------------------------- foundations
  # The catalog and schema must already exist (deploy.sh step 1 creates the schema; the
  # catalog is admin-created). The corpus volume, secret scope and Vector Search endpoint are
  # bundle-managed but protected: `bundle destroy` refuses to delete them (prevent_destroy) —
  # they hold the corpus and the gateway credentials. Delete them by hand at teardown.
  secret_scopes:
    # Holds the gateways' upstream token (and the optional Azure AI Foundry key). The VALUES
    # are put by hand: databricks secrets put-secret <secret_scope> <gw_token_secret_key>.
    mygpt_secrets:
      name: ${var.secret_scope}
      lifecycle:
        prevent_destroy: true

  vector_search_endpoints:
    # Serves the corpus index. The index itself is created by mygpt_etl's sync_index task
    # (its source table, doc_chunks, only exists after the ETL's first run).
    mygpt_vs:
      name: ${var.vs_endpoint}
      endpoint_type: STANDARD
      lifecycle:
        prevent_destroy: true

  # ---------------------------------------------------------------- Phase 4: Lakebase
  # App state (libraries, per-user upload index, history, feedback). Creating the project also
  # creates the `production` branch, its `primary` read-write endpoint and the default
  # `databricks_postgres` database; the app's service principal creates and owns the `mygpt`
  # schema on first start (app/server/db/migrations.ts).
  postgres_projects:
    mygpt:
      project_id: ${var.pg_project}
      display_name: ${var.pg_display_name}
      pg_version: 17
      default_endpoint_settings:
        autoscaling_limit_min_cu: 0.5
        autoscaling_limit_max_cu: 4

  volumes:
    # The governed corpus PDFs, one top-level folder per corpus (= the agent's custom_inputs.corpus).
    docs:
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      name: ${var.docs_volume}
      volume_type: MANAGED
      comment: "Raw source documents (FILE EXTERNAL corpus)"
      lifecycle:
        prevent_destroy: true

    # Upload-library files, one folder per library (written by the app, read by mygpt_upload_ingest).
    uploads:
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      name: ${var.uploads_volume}
      comment: "MyGPT upload libraries: uploads/<library_id>/<doc_id>__<file>"

    # MyGPT-evaluations' CSVs (kinome / kinase seed, eval questions and gold) at their repo-relative
    # paths under MyGPT-evaluations/, uploaded by deploy.sh step 6 (`make reference-csvs`). Jobs
    # read here first and fall back to the bundle-synced reference/ copy (dev checkouts).
    reference:
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      name: ${var.reference_volume}
      comment: "MyGPT-evaluations reference CSVs: MyGPT-evaluations/<repo path>.csv"

    # St. Jude's PRIVATE ground truths (SME-labelled MyGPT answers + kinase gold), uploaded by
    # `make eval-private`; read by the eval jobs (eval/eval_datasets.py private_dir). Never in
    # git or the bundle sync. No grants: only the owner (the deployer, who is the eval jobs'
    # run-as identity) and metastore admins can read it. To share with the project team:
    #   grants: [{principal: <team group>, privileges: [READ_VOLUME]}]
    eval_private:
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      name: ${var.eval_private_volume}
      comment: "PRIVATE: St. Jude MyGPT-evaluations ground truths (restricted; see eval/README.md)"

  experiments:
    # Phase 2: ONE shared experiment for the agent lifecycle — LoggedModels (driver.py),
    # offline eval runs (eval/run_eval.py), and the endpoint's production traces +
    # monitoring scorers (eval/monitor.py). The /Shared/mygpt folder must exist:
    #   databricks workspace mkdirs /Shared/mygpt -p mygpt
    mygpt_rag_agent:
      name: ${var.experiment_path}

  dashboards:
    # Phase 2 gold evals: Databricks agent vs MyGPT on the benchmarks, read straight from the
    # MLflow system tables (no ETL). Generated by dashboards/build_dashboard.py; see eval/README.md.
    # embed_credentials: viewers see it through the deployer's access to system.mlflow.
    mygpt_benchmarks:
      display_name: "${var.name_prefix} ${var.dashboard_display_name}"
      file_path: ./dashboards/mygpt_benchmarks.lvdash.json
      warehouse_id: ${var.warehouse_id}
      embed_credentials: true

  jobs:
    mygpt_etl:
      name: "${var.name_prefix} ETL — parse, section-chunk, index config"
      tasks:
        - task_key: landing
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/sql/01_landing_documents.sql
            parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              docs_volume: ${var.docs_volume}
        - task_key: parse_chunk_index
          depends_on: [{ task_key: landing }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/sql/02_parse_chunk_index.sql
            parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              docs_volume: ${var.docs_volume}
        # Phase 6: re-extract garbled / script-less (e.g. Hindi without Devanagari) documents
        # with PyMuPDF before chunking; records doc_parse_quality. No-op when nothing is flagged.
        - task_key: parse_fallback
          depends_on: [{ task_key: parse_chunk_index }]
          environment_key: default
          spark_python_task:
            python_file: etl/parse_fallback.py
            parameters:
              ["--catalog", "${var.catalog}", "--schema", "${var.schema}", "--base-dir", "${workspace.file_path}"]
        - task_key: chunk_merge
          depends_on: [{ task_key: parse_fallback }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/sql/02b_chunk_merge.sql
            parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              docs_volume: ${var.docs_volume}
        - task_key: sections_and_config
          depends_on: [{ task_key: chunk_merge }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/sql/03_sections_and_config.sql
            parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              docs_volume: ${var.docs_volume}
        # 02b MERGEs chunk changes into doc_chunks; sync the TRIGGERED index so they become
        # searchable, and wait until it has caught up (fails on a row-count mismatch). Creates
        # the index on the first run.
        - task_key: sync_index
          depends_on: [{ task_key: chunk_merge }]
          environment_key: default
          spark_python_task:
            python_file: etl/sync_index.py
            parameters:
              ["--index", "${var.catalog}.${var.schema}.${var.vs_index}",
               "--source-table", "${var.catalog}.${var.schema}.doc_chunks",
               "--endpoint", "${resources.vector_search_endpoints.mygpt_vs.name}",
               "--embedding-endpoint", "${var.embedding_endpoint}"]
        # Phase 5: structured tables for Genie (kinome, kinase_papers, corpus_documents view).
        # After chunk_merge because the view counts doc_chunks.
        - task_key: structured_seed
          depends_on: [{ task_key: chunk_merge }]
          environment_key: default
          spark_python_task:
            python_file: etl/structured_seed.py
            parameters:
              ["--catalog", "${var.catalog}", "--schema", "${var.schema}", "--base-dir", "${workspace.file_path}",
               "--reference-volume", "/Volumes/${var.catalog}/${var.schema}/${var.reference_volume}"]
      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - databricks-sdk>=0.40
              - pymupdf>=1.24   # Phase 6: parse_fallback

    # Phase 4: index one upload library into Lakebase. Triggered by the app (job_parameters
    # library_id) after an upload; one active run per library is enforced by the app.
    mygpt_upload_ingest:
      name: "${var.name_prefix} Upload ingest — parse, chunk, embed into Lakebase"
      max_concurrent_runs: 4
      parameters:
        - name: library_id
          default: ""
      tasks:
        - task_key: upload_ingest
          environment_key: default
          spark_python_task:
            python_file: etl/upload_ingest.py
            parameters:
              ["--library-id", "{{job.parameters.library_id}}",
               "--pg-endpoint", "projects/${var.pg_project}/branches/production/endpoints/primary",
               "--pg-schema", "${var.pg_schema}", "--embed-endpoint", "${var.embeddings_gateway}"]
      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - databricks-sdk>=0.70
              - psycopg[binary]>=3.2
              - pymupdf>=1.24   # Phase 6: parse fallback

    mygpt_deploy_embedding:
      name: "${var.name_prefix} Deploy bge-m3 embedding endpoint"
      tasks:
        - task_key: deploy_embedding
          environment_key: default
          spark_python_task:
            python_file: agents/embedding/driver.py
            parameters:
              ["--catalog", "${var.catalog}", "--schema", "${var.schema}", "--base-dir", "${workspace.file_path}",
               "--model-name", "${var.embedding_model}", "--endpoint-name", "${var.embedding_endpoint}"]
      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - mlflow>=3.1.0
              - databricks-sdk>=0.40
              - sentence-transformers>=3.0.0
              - torch>=2.3

    mygpt_deploy_gateway:
      name: "${var.name_prefix} Deploy Unity AI Gateway embeddings endpoint"
      tasks:
        - task_key: deploy_gateway
          environment_key: default
          spark_python_task:
            python_file: agents/gateway/driver.py
            parameters:
              ["--catalog", "${var.catalog}", "--schema", "${var.schema}", "--base-dir", "${workspace.file_path}",
               "--endpoint-name", "${var.embeddings_gateway}", "--upstream-endpoint", "${var.embedding_endpoint}",
               "--secret-scope", "${var.secret_scope}", "--token-secret-key", "${var.gw_token_secret_key}"]
      environments:
        - environment_key: default
          spec:
            client: "1"
            # The gateway endpoint is pure routing (external-model proxy) — the deploy
            # job only needs the SDK; no torch/sentence-transformers serving libs.
            dependencies:
              - mlflow>=3.1.0
              - databricks-sdk>=0.40

    # Phase 5: Unity AI Gateway chat endpoint mygpt-chat (FMAPI Sonnet; usage tracking,
    # inference table, per-user rate limit). Add the Azure AI Foundry route with
    #   --azure-endpoint https://<res>.openai.azure.com --azure-deployment <name>
    # once St. Jude shares it (secret mygpt/azure_foundry_key).
    mygpt_deploy_chat_gateway:
      name: "${var.name_prefix} Deploy Unity AI Gateway chat endpoint"
      tasks:
        - task_key: deploy_chat_gateway
          environment_key: default
          spark_python_task:
            python_file: agents/gateway/driver.py
            parameters:
              ["--task", "chat", "--catalog", "${var.catalog}", "--schema", "${var.schema}",
               "--base-dir", "${workspace.file_path}",
               "--endpoint-name", "${var.chat_gateway}", "--upstream-endpoint", "${var.chat_upstream}",
               "--secret-scope", "${var.secret_scope}", "--token-secret-key", "${var.gw_token_secret_key}",
               "--azure-key-secret-key", "${var.azure_key_secret_key}"]
      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - databricks-sdk>=0.70

    # Phase 6: mygpt-translate -> databricks-gemma-3-12b, the RAG agent's query/answer
    # translator for non-English corpora (same upstream secret as the other gateways).
    mygpt_deploy_translate_gateway:
      name: "${var.name_prefix} Deploy Unity AI Gateway translation endpoint"
      tasks:
        - task_key: deploy_translate_gateway
          environment_key: default
          spark_python_task:
            python_file: agents/gateway/driver.py
            parameters:
              ["--task", "translate", "--catalog", "${var.catalog}", "--schema", "${var.schema}",
               "--base-dir", "${workspace.file_path}",
               "--endpoint-name", "${var.translate_gateway}", "--upstream-endpoint", "${var.translate_upstream}",
               "--secret-scope", "${var.secret_scope}", "--token-secret-key", "${var.gw_token_secret_key}"]
      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - databricks-sdk>=0.70

    # Phase 5: the domain tools as UC functions in <catalog>.mygpt_tools (served by managed
    # MCP) and the HTTP connections they call.
    mygpt_deploy_tools:
      name: "${var.name_prefix} Deploy UC-function tools (managed MCP)"
      tasks:
        - task_key: connections
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: agents/tools/sql/01_connections.sql
        - task_key: functions
          depends_on: [{ task_key: connections }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: agents/tools/sql/02_functions.sql
            parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              tools_schema: ${var.tools_schema}

    # Phase 5: Genie space over the structured seed tables (mygpt_etl structured_seed).
    mygpt_deploy_genie:
      name: "${var.name_prefix} Deploy Genie space (structured data)"
      tasks:
        - task_key: deploy_genie
          environment_key: default
          spark_python_task:
            python_file: agents/genie/driver.py
            parameters:
              ["--catalog", "${var.catalog}", "--schema", "${var.schema}", "--warehouse-id", "${var.warehouse_id}",
               "--base-dir", "${workspace.file_path}", "--title", "${var.genie_title}"]
      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - databricks-sdk>=0.40

    # Phase 5: the Supervisor. Needs mygpt-chat, mygpt-rag-agent, the tools and the Genie space.
    mygpt_deploy_supervisor:
      name: "${var.name_prefix} Deploy MyGPT Supervisor ResponsesAgent endpoint"
      tasks:
        - task_key: deploy_supervisor
          environment_key: default
          spark_python_task:
            python_file: agents/supervisor/driver.py
            parameters:
              ["--catalog", "${var.catalog}", "--schema", "${var.schema}", "--warehouse-id", "${var.warehouse_id}",
               "--base-dir", "${workspace.file_path}", "--experiment", "${resources.experiments.mygpt_rag_agent.name}",
               "--tools-schema", "${var.tools_schema}", "--model-name", "${var.supervisor_model}",
               "--endpoint-name", "${var.supervisor_endpoint}", "--llm-endpoint", "${var.chat_gateway}",
               "--rag-endpoint", "${var.rag_agent_endpoint}", "--genie-title", "${var.genie_title}",
               "--secret-scope", "${var.secret_scope}", "--langsmith-secret-key", "${var.langsmith_api_key_secret_key}",
               "--langsmith-project", "${var.langsmith_project}", "--langsmith-endpoint", "${var.langsmith_endpoint}",
               "--langsmith-workspace-id", "${var.langsmith_workspace_id}",
               "--langsmith-hide-content", "${var.langsmith_hide_content}"]
      environments:
        - environment_key: default
          spec:
            client: "1"
            # Pure routing: no serving libs. The log-time validation predict calls mygpt-chat
            # and managed MCP live.
            dependencies:
              - mlflow>=3.4
              - databricks-agents
              - databricks-sdk>=0.40

    mygpt_deploy_agent:
      name: "${var.name_prefix} Deploy MyGPT RAG ResponsesAgent endpoint"
      tasks:
        - task_key: deploy_agent
          environment_key: default
          spark_python_task:
            python_file: agents/rag_agent/driver.py
            parameters:
              ["--catalog", "${var.catalog}", "--schema", "${var.schema}", "--base-dir", "${workspace.file_path}",
               "--experiment", "${resources.experiments.mygpt_rag_agent.name}", "--vs-index-name", "${var.vs_index}",
               "--model-name", "${var.rag_agent_model}", "--endpoint-name", "${var.rag_agent_endpoint}",
               "--vs-endpoint", "${var.vs_endpoint}", "--embed-endpoint", "${var.embeddings_gateway}",
               "--vs-embed-endpoint", "${var.embedding_endpoint}", "--chat-endpoint", "${var.chat_gateway}",
               "--translate-endpoint", "${var.translate_gateway}", "--sonnet-endpoint", "${var.fm_sonnet}",
               "--llama-endpoint", "${var.fm_llama}", "--gptoss-endpoint", "${var.fm_gptoss}",
               "--secret-scope", "${var.secret_scope}", "--langsmith-secret-key", "${var.langsmith_api_key_secret_key}",
               "--langsmith-project", "${var.langsmith_project}", "--langsmith-endpoint", "${var.langsmith_endpoint}",
               "--langsmith-workspace-id", "${var.langsmith_workspace_id}",
               "--langsmith-hide-content", "${var.langsmith_hide_content}"]
      environments:
        - environment_key: default
          spec:
            client: "1"
            # MLflow runs a full validation predict at log time (retrieve -> rerank ->
            # generate -> score), so the job env needs the serving libs too.
            dependencies:
              - mlflow>=3.1.0
              - databricks-agents
              - databricks-sdk>=0.40
              - sentence-transformers>=3.0.0
              - torch>=2.3
              - scikit-learn>=1.5
              - PyStemmer>=2.2

    # ---------------------------------------------------------------- Phase 2: eval
    mygpt_eval_build_datasets:
      name: "${var.name_prefix} Eval — build UC eval datasets (MyGPT-evaluations)"
      tasks:
        - task_key: build_datasets
          environment_key: eval
          spark_python_task:
            python_file: eval/build_datasets.py
            parameters:
              ["--catalog", "${var.catalog}", "--schema", "${var.schema}", "--base-dir", "${workspace.file_path}",
               "--experiment", "${resources.experiments.mygpt_rag_agent.name}",
               "--datasets", "{{job.parameters.datasets}}",
               "--docs-volume", "/Volumes/${var.catalog}/${var.schema}/${var.docs_volume}",
               "--private-volume", "/Volumes/${var.catalog}/${var.schema}/${var.eval_private_volume}",
               "--reference-volume", "/Volumes/${var.catalog}/${var.schema}/${var.reference_volume}"]
      parameters:
        - name: datasets
          default: "health_policies_fr,health_policies_es,health_policies_hi,kinase_literature,bioasq"
      environments:
        - environment_key: eval
          spec:
            client: "1"
            dependencies: ["mlflow[databricks]>=3.4", "databricks-agents", "databricks-sdk>=0.40", "pyyaml"]

    mygpt_eval:
      name: "${var.name_prefix} Eval — mlflow.genai.evaluate over dataset x model (+ gates)"
      parameters:
        # One run per {dataset, model}; add llama / gptoss entries for the model comparison.
        - name: matrix
          default: '[{"dataset": "health_policies_fr", "model": "sonnet"}, {"dataset": "health_policies_es", "model": "sonnet"}, {"dataset": "kinase_literature", "model": "sonnet"}, {"dataset": "bioasq", "model": "sonnet"}]'
        - name: max_rows
          default: "0"
        - name: gate
          default: "false"
        # Phase 6 A/B: auto (dataset config decides) | true | false — applies to every entry.
        - name: translate
          default: "auto"
      tasks:
        - task_key: eval
          for_each_task:
            inputs: "{{job.parameters.matrix}}"
            # one dataset at a time: the agent endpoint (CPU Small) is the bottleneck
            concurrency: 1
            task:
              task_key: eval_one
              environment_key: eval
              spark_python_task:
                python_file: eval/run_eval.py
                parameters:
                  ["--dataset", "{{input.dataset}}", "--model", "{{input.model}}",
                   "--catalog", "${var.catalog}", "--schema", "${var.schema}", "--base-dir", "${workspace.file_path}",
                   "--experiment", "${resources.experiments.mygpt_rag_agent.name}",
                   "--max-rows", "{{job.parameters.max_rows}}", "--gate", "{{job.parameters.gate}}",
                   "--translate", "{{job.parameters.translate}}", "--endpoint", "${var.rag_agent_endpoint}",
                   "--docs-volume", "/Volumes/${var.catalog}/${var.schema}/${var.docs_volume}",
                   "--private-volume", "/Volumes/${var.catalog}/${var.schema}/${var.eval_private_volume}",
                   "--reference-volume", "/Volumes/${var.catalog}/${var.schema}/${var.reference_volume}"]
      environments:
        - environment_key: eval
          spec:
            client: "1"
            dependencies: ["mlflow[databricks]>=3.4", "databricks-agents", "databricks-sdk>=0.40", "pyyaml"]

    # MyGPT parity baseline + judge agreement from MyGPT's own recorded answers (no agent
    # endpoint calls; the LLM correctness judge runs unless judge=false).
    mygpt_eval_reference:
      name: "${var.name_prefix} Eval — MyGPT reference baseline + judge agreement"
      parameters:
        - name: judge
          default: "true"
      tasks:
        - task_key: reference
          environment_key: eval
          spark_python_task:
            python_file: eval/reference_baseline.py
            parameters:
              ["--base-dir", "${workspace.file_path}", "--experiment", "${resources.experiments.mygpt_rag_agent.name}",
               "--judge", "{{job.parameters.judge}}",
               "--docs-volume", "/Volumes/${var.catalog}/${var.schema}/${var.docs_volume}",
               "--private-volume", "/Volumes/${var.catalog}/${var.schema}/${var.eval_private_volume}",
               "--reference-volume", "/Volumes/${var.catalog}/${var.schema}/${var.reference_volume}"]
      environments:
        - environment_key: eval
          spec:
            client: "1"
            dependencies: ["mlflow[databricks]>=3.4", "databricks-agents", "databricks-sdk>=0.40", "pyyaml"]

    mygpt_eval_monitor:
      name: "${var.name_prefix} Eval — register production-monitoring scorers"
      tasks:
        - task_key: monitor
          environment_key: eval
          spark_python_task:
            python_file: eval/monitor.py
            parameters:
              ["--base-dir", "${workspace.file_path}", "--experiment", "${resources.experiments.mygpt_rag_agent.name}"]
      environments:
        - environment_key: eval
          spec:
            client: "1"
            dependencies: ["mlflow[databricks]>=3.4", "databricks-agents", "databricks-sdk>=0.40", "pyyaml"]

targets:
  default:
    default: true
    workspace:
      host: https://adb-7405616422000820.0.azuredatabricks.net
